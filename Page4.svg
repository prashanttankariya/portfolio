features.</tspan><tspan x="0" y="483"></tspan></tspan><tspan x="0" y="504">Food Samachar – Food Magazine</tspan><tspan font-weight="400"><tspan x="0" y="525">Designed a custom publishing platform for Gujarat’s food industry </tspan><tspan x="0" y="546">with articles, categories, and image galleries.</tspan></tspan><tspan x="0" y="567"></tspan><tspan x="0" y="588"></tspan></text>
