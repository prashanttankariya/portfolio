Expanded creative skills from traditional art to digital design " transform="translate(77 449)" font-size="15" font-family="Bahnschrift" letter-spacing="0.046em"><tspan x="0" y="0">Started as an MS Office Tutor and grew into a Star Faculty at </tspan><tspan x="0" y="21">Aptech Computer Education. </tspan><tspan x="0" y="42"></tspan><tspan x="0" y="63">Mentored 100+ aspiring developers, many now placed globally, </tspan><tspan x="0" y="84">and specialized in Excel automation.</tspan><tspan x="0" y="105"></tspan><tspan x="0" y="126">Expanded creative skills from traditional art to digital design </tspan><tspan x="0" y="147">using Adobe Illustrator and XD. </tspan><tspan x="0" y="168"></tspan><tspan x="0" y="189">Recognized for innovative teaching methods, mentorship, and </tspan><tspan x="0" y="210">strong problem-solving abilities.</tspan><tspan x="0" y="231"></tspan><tspan x="0" y="252">Also supported government exam aspirants with document </tspan><tspan x="0" y="273">preparation and training.</tspan></text>
