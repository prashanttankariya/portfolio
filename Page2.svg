applications that solve real-world challeng" transform="translate(77 236)" font-size="15" font-family="Bahnschrift" letter-spacing="0.046em"><tspan x="0" y="0">Full-stack web developer with 9+ years of experience </tspan><tspan x="0" y="21">delivering scalable web and mobile solutions, mentoring teams, </tspan><tspan x="0" y="42">and leading enterprise projects. </tspan><tspan x="0" y="63"></tspan><tspan x="0" y="84">Currently exploring AI and automation to build intelligent </tspan><tspan x="0" y="105">applications that solve real-world challenges.</tspan></text>
