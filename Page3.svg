    <text id="Flutter_Development:_Building_cross-platform_mobile_applications_with_responsive_UI_UX_and_seamless_backend_integration._AI_Automation:_Exploring_AI-driven_workflows_chatbots_predictive_analytics_and_business_automation._Vision:_Combine_backend_" data-name="Flutter Development: Building cross-platform mobile applications 
with responsive UI/UX and seamless backend integration. AI &amp; Automation: Exploring AI-driven workflows, chatbots, predictive analytics, and business automation. Vision: Combine backend " transform="translate(85 260)" font-size="15" font-family="Bahnschrift" letter-spacing="0.03em" font-weight="700"><tspan x="0" y="0">Flutter Development:</tspan><tspan y="0" xml:space="preserve" font-weight="400"> Building cross-platform mobile applications </tspan><tspan font-weight="400"><tspan x="0" y="21">with responsive UI/UX and seamless backend integration. </tspan><tspan x="0" y="42"></tspan></tspan><tspan x="0" y="63">AI &amp; Automation:</tspan><tspan y="63" xml:space="preserve" font-weight="400"> Exploring AI-driven workflows, </tspan><tspan font-weight="400"><tspan x="0" y="84">chatbots, predictive analytics, and business automation. </tspan><tspan x="0" y="105"></tspan></tspan><tspan x="0" y="126">Vision:</tspan><tspan y="126" xml:space="preserve" font-weight="400"> Combine backend expertise, mobile-first technologies, </tspan><tspan font-weight="400"><tspan x="0" y="147">and AI to deliver next-gen enterprise and consumer solutions.</tspan></tspan></text>
    <text id="Shreemati_Ji_Supermart_2016_2020_discontinued_later_:_Built_an_online_marketplace_for_women_integrating_product_catalog_shopping_cart_and_order_workflows._Servixo_QR_Ordering_App:_Developed_a_QR-based_restaurant_ordering_system_using_Laravel_5.8" data-name="Shreemati Ji Supermart (2016–2020, discontinued later): Built an online marketplace for women, integrating product catalog, 
shopping cart, and order workflows.Servixo – QR Ordering App: Developed a QR-based restaurant ordering system using Laravel 5.8" transform="translate(86 529)" font-size="15" font-family="Bahnschrift" letter-spacing="0.03em" font-weight="700"><tspan x="0" y="0">Shreemati Ji Supermart (2016–2020, discontinued later):</tspan><tspan y="0" font-weight="400"> </tspan><tspan font-weight="400"><tspan x="0" y="21">Built an online marketplace for women, integrating product catalog, </tspan><tspan x="0" y="42">shopping cart, and order workflows.</tspan><tspan x="0" y="63"></tspan></tspan><tspan x="0" y="84">Servixo – QR Ordering App:</tspan><tspan y="84" font-weight="400"> </tspan><tspan font-weight="400"><tspan x="0" y="105">Developed a QR-based restaurant ordering system using Laravel 5.8.</tspan><tspan x="0" y="126">Enabled customers to place orders directly from their phones, </tspan><tspan x="0" y="147">reducing wait times and improving operational efficiency.</tspan><tspan x="0" y="168"></tspan></tspan><tspan x="0" y="189">ERP &amp; Custom Solutions (2020–2022):</tspan><tspan y="189" font-weight="400"> </tspan><tspan font-weight="400"><tspan x="0" y="210">Combine backend expertise, mobile-first technologies, </tspan><tspan x="0" y="231">and AI to deliver next-gen enterprise and consumer solutions.</tspan></tspan></text>
